<svg width="960" height="600" viewBox="0 0 960 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">cars entity relationship diagram</title>
  <desc id="desc">Single cars entity used by the used car admin service.</desc>

  <rect width="960" height="600" fill="#f8fafc"/>

  <text x="480" y="54" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Used Car Admin ERD</text>
  <text x="480" y="82" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#64748b">In-memory data model based on data/data.json</text>

  <rect x="210" y="120" width="540" height="450" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <rect x="210" y="120" width="540" height="60" rx="4" fill="#1d4ed8"/>
  <path d="M210 176H750V180H210V176Z" fill="#0f172a"/>
  <text x="480" y="158" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">cars</text>

  <text x="246" y="216" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Column</text>
  <text x="430" y="216" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Type</text>
  <text x="610" y="216" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Note</text>
  <line x1="210" y1="236" x2="750" y2="236" stroke="#cbd5e1"/>

  <text x="246" y="270" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">_id</text>
  <text x="430" y="270" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#334155">Number</text>
  <text x="610" y="270" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#334155">Primary key</text>
  <line x1="210" y1="292" x2="750" y2="292" stroke="#e2e8f0"/>

  <text x="246" y="326" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">name</text>
  <text x="430" y="326" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#334155">String</text>
  <text x="610" y="326" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#334155">Required</text>
  <line x1="210" y1="348" x2="750" y2="348" stroke="#e2e8f0"/>

  <text x="246" y="382" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">price</text>
  <text x="430" y="382" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#334155">Number</text>
  <text x="610" y="382" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#334155">0 or higher</text>
  <line x1="210" y1="404" x2="750" y2="404" stroke="#e2e8f0"/>

  <text x="246" y="438" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">company</text>
  <text x="430" y="438" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#334155">String</text>
  <text x="610" y="438" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#334155">Required</text>
  <line x1="210" y1="460" x2="750" y2="460" stroke="#e2e8f0"/>

  <text x="246" y="494" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">year</text>
  <text x="430" y="494" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#334155">Number</text>
  <text x="610" y="494" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#334155">0 or higher</text>

  <rect x="210" y="500" width="540" height="1" fill="#e2e8f0"/>
  <text x="246" y="532" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">created_at</text>
  <text x="430" y="532" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#334155">ISO date string</text>
  <text x="610" y="532" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#334155">Created time</text>
