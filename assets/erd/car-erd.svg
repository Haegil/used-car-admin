<svg width="900" height="520" viewBox="0 0 900 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="520" fill="#f8fafc"/>
  <rect x="250" y="70" width="400" height="380" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <rect x="250" y="70" width="400" height="58" fill="#1d4ed8"/>
  <text x="450" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">cars</text>
  <line x1="250" y1="128" x2="650" y2="128" stroke="#0f172a" stroke-width="2"/>
  <text x="280" y="170" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">_id</text>
  <text x="455" y="170" font-family="Arial, sans-serif" font-size="18" fill="#334155">INT, PK, AUTO_INCREMENT</text>
  <line x1="250" y1="190" x2="650" y2="190" stroke="#e2e8f0"/>
  <text x="280" y="225" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">name</text>
  <text x="455" y="225" font-family="Arial, sans-serif" font-size="18" fill="#334155">VARCHAR(100), NOT NULL</text>
  <line x1="250" y1="245" x2="650" y2="245" stroke="#e2e8f0"/>
  <text x="280" y="280" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">price</text>
  <text x="455" y="280" font-family="Arial, sans-serif" font-size="18" fill="#334155">INT, NOT NULL</text>
  <line x1="250" y1="300" x2="650" y2="300" stroke="#e2e8f0"/>
  <text x="280" y="335" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">company</text>
  <text x="455" y="335" font-family="Arial, sans-serif" font-size="18" fill="#334155">VARCHAR(50), NOT NULL</text>
  <line x1="250" y1="355" x2="650" y2="355" stroke="#e2e8f0"/>
  <text x="280" y="390" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">year</text>
  <text x="455" y="390" font-family="Arial, sans-serif" font-size="18" fill="#334155">INT, NOT NULL</text>
  <line x1="250" y1="410" x2="650" y2="410" stroke="#e2e8f0"/>
  <text x="280" y="445" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">created_at</text>
  <text x="455" y="445" font-family="Arial, sans-serif" font-size="18" fill="#334155">DATETIME, DEFAULT CURRENT_TIMESTAMP</text>
  <text x="450" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748b">서버 메모리에 저장되는 단일 cars 엔티티</text>
</svg>
